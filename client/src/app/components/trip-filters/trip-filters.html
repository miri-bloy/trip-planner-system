<div class="filters-container">
  <div class="filter-group">
    <label>Search destination:</label>
    <input type="text" placeholder="לאן תרצה לטוס?" (input)="onDestinationInput($event)" />
  </div>

  <div class="filter-group">
    <label>From date:</label>
    <input type="date" (change)="onDateChange($event)" />
  </div>

  <div class="filter-group">
    <label>Maximum price:</label>
    <input type="number" placeholder="לדוגמה: 1000" (input)="onMaxPriceInput($event)" />
  </div>

  <div class="filter-group">
    <label>Sort by:</label>
    <select (change)="onSortChange($event)">
      <option value="default">No sorting</option>
      <option value="priceAsc">Price: Low to high ↑</option>
      <option value="priceDesc">Price: High to low ↓</option>
      <option value="dateAsc">Date: Newest first 📅</option>
      <option value="dateDesc">Date: Oldest first ⏳</option>
    </select>
  </div>
</div>
