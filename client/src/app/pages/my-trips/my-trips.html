<div class="trips-container">

  <app-trip-filters 
    (destinationChange)="selectedDestination.set($event)"
    (dateChange)="selectedDate.set($event)"
    (maxPriceChange)="maxPrice.set($event)"
    (sortChange)="priceSortOrder.set($event)">
  </app-trip-filters>

  @if (filteredMyTrips().length === 0) {
    <div class="no-trips-message">
      <div class="no-trips-icon">🎒</div>
      <h3>לא נמצאו טיולים ברשימה שלך</h3>
      <p>עדיין לא נרשמת לאף טיול, או שהסינונים הנוכחיים אינם תואמים לטיולים שלך.</p>
    </div>
  } @else {
    @for (trip of filteredMyTrips(); track trip.id) {
      <app-trip-card
        [currentTrip]="trip">
      </app-trip-card>
    }
  }

</div>
