<div class="register-container">
  <h2>התחברות לאתר</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    
    <div>
      <label>שם משתמש:</label>
      <input type="text" [(ngModel)]="userModel.name" name="userName" required>
    </div>
    <div>
      <label>סיסמה:</label>
      <input type="password" [(ngModel)]="userModel.password" name="userPassword" required>
    </div>

    @if (error()) {
      <p style="color: red; font-weight: bold; padding: 5px; background-color: #ffe6e6; border: 1px solid red; border-radius: 4px;">
        {{ error() }}
      </p>
    }

    <button type="submit" [disabled]="loading() || loginForm.invalid">
      @if (loading()) { טוען... } @else { התחבר }
    </button>

  </form>

  <p>לא רשום עדיין? עבור ל <a routerLink="/register">דף הרשמה</a></p>
</div>
